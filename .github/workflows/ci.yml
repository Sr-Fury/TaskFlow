name: TaskFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++

          - compiler: Clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build build --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
